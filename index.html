<!DOCTYPE html>
<html>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            /* CSS */
        </style>

        <title>Title</title>
    </head>
    <body>
        <div style = "display: flex">
            <div id = "canvas"></div>
            <div>
                <h1>Click to roll a dice.</h1>
            </div>
        </div>
        <!-- HTML -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
        <script>
            // JS
            class player{
                constructor(x,y){
                    this.x = x
                    this.y = y
                }
                make(){
                    fill(255,20,20)
                    rect(this.x,this.y,100)
                }
            }
            var turn = 0;
            var thePlayer = []
            function mousePressed(){
                var spaces = round(random(5))
                alert("You rolled a " + spaces + "!")
            }
            function setup() {
                var theCanvas = createCanvas(800, 600);
                theCanvas.parent("canvas")
                rectMode(CENTER)
                thePlayer = new player(50,350)
            }

            function draw() {
                background(200)
                thePlayer.make
            }

        </script>
    </body>
</html>
