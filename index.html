<!DOCTYPE html>
<html>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            /* CSS */
            h1{
                text-align:center
            }
        </style>

        <title>Title</title>
    </head>
    <body>
        <div style = "display: flex">
            <div id = "canvas"></div>
            <div>
                <h1>Click to roll a dice.</h1>
                <h1 id = "temperature"></h1>
                <h1 id = "orientation"></h1>

            </div>
        </div>
        <!-- HTML -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
        <script>
            // JS
            class player{
                constructor(x,y){
                    this.x = x
                    this.y = y
                }
                make(){
                    fill(255,20,20)
                    rect(this.x,this.y,50)
                }
            }
            var turn = 0;
            var thePlayer
            var currentSpace = 1;
            var gameSpaces = [
                {
                    name:"spawn",
                    desc: "You've reached spawn!",
                    x: 133,
                    y: 500,
                    space: 1,
                    changeT: 10,
                    changeO: false,
                },
                {
                    name: 'space2',
                    desc: "desc2",
                    x: 266,
                    y: 500,
                    space: 2,
                    changeT: -10,
                    changeO: false,
                },
                {
                    name:'space3',
                    desc:'desc3',
                    x: 400,
                    y: 500,
                    space: 3,
                    changeT: 7,
                    changeO: false,
                },
                 {
                    name:'space4',
                    desc:'desc4',
                    x: 533,
                    y: 500,
                    space: 4,
                    changeT: 10,
                    changeO: false,
                },
                {
                    name:'space5',
                    desc:'desc5',
                    x: 666,
                    y: 500,
                    space: 5,
                    changeT: 0,
                    changeO: true,
                },
                {
                    name:'space6',
                    desc:'desc6',
                    x: 666,
                    y: 367,
                    space: 6,
                    changeT: -5,
                    changeO: false,
                },
                {
                    name:'space7',
                    desc:'desc7',
                    x: 666,
                    y: 234,
                    space: 7,
                    changeT: 15,
                    changeO: false,
                },
                {
                    name:'space8',
                    desc:'desc8',
                    x: 666,
                    y: 101,
                    space: 8,
                    changeT: 10,
                    changeO: false,
                },
                {
                    name:'space9',
                    desc:'desc9',
                    x: 533,
                    y: 101,
                    space: 9,
                    changeT: -15,
                    changeO: false,
                },
                {
                    name:'space10',
                    desc:'desc10',
                    x: 400,
                    y: 101,
                    space: 10,
                    changeT: 8,
                    changeO: false,
                },
                {
                    name:'space11',
                    desc:'desc11',
                    x: 267,
                    y: 101,
                    space: 11,
                    changeT: -10,
                    changeO: false,
                },
                {
                    name:'space12',
                    desc:'desc12',
                    x: 134,
                    y: 101,
                    space: 12,
                    changeT: 0,
                    changeO: true,
                },
                {
                    name:'space13',
                    desc:'desc13',
                    x: 134,
                    y: 234,
                    space: 13,
                    changeT: 25,
                    changeO: false,
                },
                {
                    name:'space14',
                    desc:'desc14',
                    x: 134,
                    y: 367,
                    space: 14,
                    changeT: 0,
                    changeO: true,
                },
            ]
            function mousePressed(){
                var spaces = round(random(5))
                alert("You rolled a " + spaces + "!")
                currentSpace += spaces
                if (currentSpace > 14){
                    currentSpace-= 14
                    pity++
                }
                for (var i = 0;i < gameSpaces.length;i++){
                    if (currentSpace == gameSpaces[i].space){
                        thePlayer.x = gameSpaces[i].x
                        thePlayer.y = gameSpaces[i].y
                        initial += gameSpaces[i].changeT
                        if (gameSpaces[i].changeO == true){
                            if (orientation == "Wrong"){
                                orientation = "Correct"
                            }
                            else if (orientation == "Correct"){
                                if(random(pity + 10) < 10)
                                orientation = "Wrong"
                            }
                        }
                        if (gameSpaces[i].name == "spawn" && initial >= 100 && orientation == "Correct"){
                            win = true
                            alert("You won and successfully collided!")
                        }
                        else{
                            alert(gameSpaces[i].desc)
                        }
                    }
                }
            }
            var initial = 25
            var temperature;
            var orientation = "Wrong"
            var orientationText;
            var pity = 0;
            var win = false;

            function setup() {
                var theCanvas = createCanvas(800, 600);
                theCanvas.parent("canvas")
                rectMode(CENTER)
                thePlayer = new player(133,500)
                textAlign(CENTER,CENTER)
            }

            function draw() {
                noStroke()
                temperature = initial + " °C" + " / 100  °C."
                orientationText = orientation + " orientation."
                document.getElementById('temperature').innerHTML = temperature
                document.getElementById('orientation').innerHTML = orientationText
                background(0)
                for (var i = 0;i < gameSpaces.length;i++){
                    if(!gameSpaces[i].changeO){
                        fill(0, 0, 255)
                    }
                    else { // changeO = true
                        fill(175, 175, 255)
                    }
                    rect(gameSpaces[i].x,gameSpaces[i].y, 100)
                }
                thePlayer.make()

                if (win == true){
                    fill(0,255,0)
                    textSize(50)
                    text("You won!",width/2,height/2)
                    console.log("true")
                }
            }

        </script>
    </body>
</html>
