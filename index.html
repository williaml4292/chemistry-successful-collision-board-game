<!DOCTYPE html>
<html>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            /* CSS */
        </style>

        <title>Title</title>
    </head>
    <body>
        <div style = "display: flex">
            <div id = "canvas"></div>
            <div>
                <h1>Click to roll a dice.</h1>
            </div>
        </div>
        <!-- HTML -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
        <script>
            // JS
            class player{
                constructor(x,y){
                    this.x = x
                    this.y = y
                }
                make(){
                    fill(255,20,20)
                    rect(this.x,this.y,50)
                }
            }
            var turn = 0;
            var thePlayer
            var currentSpace = 1;
            var gameSpaces = [
                {
                    name:"spawn",
                    desc: "You've reached spawn!",
                    x: 100,
                    y:500,
                    space: 1,
                },
                {
                    name: 'space2',
                    desc: "desc2",
                    x: 250,
                    y: 500,
                    space: 2,
                },
                {
                    name:'space3',
                    desc:'desc3',
                    x: 400,
                    y: 500,
                    space: 3,
                },
                 {
                    name:'space3',
                    desc:'desc3',
                    x: 550,
                    y: 500,
                    space: 4,
                },
                {
                    name:'space3',
                    desc:'desc3',
                    x: 700,
                    y: 500,
                    space: 5,
                },
            ]
            function mousePressed(){
                var spaces = round(random(5))
                alert("You rolled a " + spaces + "!")
                currentSpace += spaces
                for (var i = 0;i < gameSpaces.length;i++){
                    if (currentSpace == gameSpaces[i].space){
                        thePlayer.x = gameSpaces[i].x
                        thePlayer.y = gameSpaces[i].y
                    }
                }
            }
            function setup() {
                var theCanvas = createCanvas(800, 600);
                theCanvas.parent("canvas")
                rectMode(CENTER)
                thePlayer = new player(100,500)
            }

            function draw() {
                background(0)
                gameSpaces.forEach(function(space){
                    fill(0,0,255)
                    rect(space.x,space.y, 100)
                })
                thePlayer.make()
            }

        </script>
    </body>
</html>
